name: Create Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  create-release:
    if: github.repository == 'fiscal-sh/fscl'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version must be valid npm semver, got: $VERSION"
            exit 1
          fi

          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "package-lock.json version $LOCK_VERSION does not match package.json version $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES="Release $TAG"
          else
            NOTES="**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${TAG}"
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.package.outputs.tag }}
